<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#0a0906"/>

  <!-- Outer decorative ring -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="#1a1508" stroke-width="2"/>

  <!-- Dashed ring -->
  <circle cx="200" cy="200" r="162" fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.35"/>

  <!-- Main circle -->
  <circle cx="200" cy="200" r="138" fill="#0e0d0a" stroke="#c9a84c" stroke-width="1.2"/>

  <!-- Inner ring -->
  <circle cx="200" cy="200" r="120" fill="none" stroke="#6b5a2a" stroke-width="0.6" opacity="0.4"/>

  <!-- Tick marks -->
  <line x1="200" y1="20" x2="200" y2="44" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="200" y1="356" x2="200" y2="380" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="20" y1="200" x2="44" y2="200" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="356" y1="200" x2="380" y2="200" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Diagonal ticks -->
  <line x1="73" y1="73" x2="88" y2="88" stroke="#c9a84c" stroke-width="1.2" opacity="0.3"/>
  <line x1="312" y1="73" x2="327" y2="88" stroke="#c9a84c" stroke-width="1.2" opacity="0.3"/>
  <line x1="73" y1="327" x2="88" y2="312" stroke="#c9a84c" stroke-width="1.2" opacity="0.3"/>
  <line x1="312" y1="327" x2="327" y2="312" stroke="#c9a84c" stroke-width="1.2" opacity="0.3"/>

  <!-- XAU text -->
  <text x="200" y="188" text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="58" font-weight="700"
    letter-spacing="6"
    fill="#e8c96a">XAU</text>

  <!-- Divider line -->
  <line x1="110" y1="202" x2="290" y2="202" stroke="#6b5a2a" stroke-width="1"/>

  <!-- GOLD text -->
  <text x="200" y="228" text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20" font-weight="400"
    letter-spacing="10"
    fill="#7a7060">GOLD</text>

  <!-- AURORA text bottom arc simulation - straight -->
  <text x="200" y="272" text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="22" font-weight="400"
    letter-spacing="12"
    fill="#c9a84c" opacity="0.8">AURORA</text>

  <!-- Small decorative dots -->
  <circle cx="200" cy="155" r="3" fill="#e8c96a" opacity="0.6"/>
</svg>
